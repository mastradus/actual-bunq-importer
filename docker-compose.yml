services:
  sync:
    build: .
    container_name: bunq-actual-sync
    restart: unless-stopped
    ports:
      # Plain HTTP: use "127.0.0.1:8080:8080" (Docker host only) or an HTTPS
      # reverse proxy if the network between you and this host isn't trusted.
      - "8080:8080"
    volumes:
      # Persist secrets and state outside the image
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      # Development only: mount templates for live editing without rebuild
      # - ./templates:/app/templates
    environment:
      - TZ=${TZ:-Europe/Berlin}
      # Protect the web UI with HTTP basic auth (strongly recommended).
      # Leave both empty to disable authentication.
      - WEB_USERNAME=${WEB_USERNAME:-}
      - WEB_PASSWORD=${WEB_PASSWORD:-}
    extra_hosts:
      # lets the container reach an Actual server running on the Docker host
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
